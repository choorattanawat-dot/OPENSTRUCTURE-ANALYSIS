[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openstructure"
version = "0.1.0"
description = "In-house OpenSeesPy structural analysis tool driven by ETABS .e2k text exports"
requires-python = ">=3.10"
dependencies = ["openseespy", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["openstructure"]
