[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openstructure"
version = "0.1.0"
description = "Structural analysis and reinforced-concrete member design (EIT 1008 and ACI 318-19)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OPENSTRUCTURE-ANALYSIS contributors" }]
keywords = ["structural-analysis", "opensees", "reinforced-concrete", "EIT", "ACI318"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openseespy>=3.5",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
openstructure = "openstructure.cli:main"

[project.urls]
Homepage = "https://github.com/choorattanawat-dot/OPENSTRUCTURE-ANALYSIS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
